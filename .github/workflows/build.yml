name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build for Calliope mini
        run: npx --yes makecode@1.3.6 build
      - name: Build for micro:bit
        run: npx --yes makecode@1.3.6 build -c mkc-microbit.json
